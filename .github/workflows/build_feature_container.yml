name: Build & Package Container

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
    tags:
      - 'v*'
      - 'preview*'
  pull_request:
    branches:
      - 'main'
      - 'stable'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish image to GHCR (true/false)'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Optional custom image tag'
        required: false
        type: string
        default: 'preview'

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Verification Job (Dry Run - No Push)
  build_verify:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (Validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Publishing Job (Runs only on workflow_dispatch with publish=true or release tags)
  publish_ghcr:
    name: Publish Container to GHCR
    needs: build_verify
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=${{ inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_name != '' }}

      - name: Build and push container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
